[versions]
awaitility = "4.3.0"
flyway = "11.20.2"
hikariCP = "6.3.0"
jackson2 = "2.22.1"
java-jwt = "4.6.0"
kafka = "4.3.1"
kotlin = "2.4.10"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization-json = "1.11.0"
rapidsAndRivers = "2026071513121784113927"
ktor = "3.5.2"
logback = "1.6.0"
logstash-logback-encoder = "9.0"
micrometer = "1.17.0"
mockk = "1.14.11"
opentelemetry-instrumentation = "2.30.0"
postgresql = "42.7.13"
slf4j = "2.0.18"
